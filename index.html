<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Global Water Fund — Planetary Water Systems</title>

<style>

:root{
  --bg0:#07080b;
  --bg1:#0b0d12;
  --ink:#f2f5ff;
  --muted:rgba(242,245,255,.70);
  --muted2:rgba(242,245,255,.48);
  --accent:#9fd7ff;
}

/* =========================================================
   PAGE
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:
    radial-gradient(
      1200px 800px at 60% 35%,
      var(--bg1) 0%,
      var(--bg0) 55%,
      #05060a 100%
    );

  color:var(--ink);

  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================================================
   EARTH STAGE
   ========================================================= */

.stage{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  display:block;
}

/* =========================================================
   HERO
   ========================================================= */

.heroText{
  position:relative;
  z-index:5;

  width:100%;
  height:100%;

  display:grid;
  align-content:center;

  padding:
    clamp(22px,5vw,72px);

  max-width:980px;

  pointer-events:none;
}

.heroInner{
  pointer-events:auto;
}

.kicker{
  text-transform:uppercase;

  letter-spacing:.18em;

  font-size:12px;

  color:var(--muted2);

  margin-bottom:12px;

  opacity:0;

  transform:
    translateY(8px);

  animation:
    fadeUp .65s ease forwards;

  animation-delay:.15s;
}

h1{
  font-size:
    clamp(36px,4.6vw,68px);

  line-height:1.03;

  margin:0;

  font-weight:650;

  letter-spacing:-.01em;

  opacity:0;

  transform:
    translateY(8px);

  animation:
    fadeUp .75s ease forwards;

  animation-delay:.35s;
}

/* =========================================================
   EXPLORE
   ========================================================= */

.explore{
  display:inline-flex;

  align-items:center;

  gap:11px;

  margin-top:24px;

  padding:
    10px 0;

  color:
    rgba(242,245,255,.58);

  text-transform:uppercase;

  letter-spacing:.22em;

  font-size:10px;

  opacity:0;

  transform:
    translateY(8px);

  animation:
    fadeUp .75s ease forwards;

  animation-delay:.65s;

  transition:
    color .25s ease;
}

.explore:hover{
  color:#fff;
}

.arrow{
  display:inline-block;

  color:var(--accent);

  font-size:17px;

  line-height:1;

  animation:
    arrowMove 1.8s ease-in-out infinite;
}

/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes fadeUp{

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes arrowMove{

  0%,
  100%{
    transform:
      translateX(0);

    opacity:.55;
  }

  50%{
    transform:
      translateX(6px);

    opacity:1;
  }

}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width:900px){

  .heroText{
    padding:22px;
  }

  .kicker{
    font-size:10px;
  }

  h1{
    font-size:
      clamp(34px,10vw,48px);

    max-width:8em;
  }

  .explore{
    margin-top:20px;

    font-size:9px;
  }

}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion:reduce){

  .arrow{
    animation:none;
  }

}

</style>
</head>


<body>


<section
  class="stage"
  id="hero"
>

  <!-- ORIGINAL SPINNING EARTH -->

  <canvas id="globe"></canvas>


  <!-- TEXT -->

  <div class="heroText">

    <div class="heroInner">

      <div class="kicker">
        GLOBAL WATER FUND
      </div>

      <h1>
        Global water intelligence.
      </h1>


      <!-- IMMEDIATE ENTRY -->

      <a
        class="explore"
        href="planetary.html"
        aria-label="Explore Global Water Fund"
      >

        <span>
          Explore
        </span>

        <span
          class="arrow"
          aria-hidden="true"
        >
          →
        </span>

      </a>

    </div>

  </div>

</section>


<!-- THREE.JS -->

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>


<script>

(function(){

  const canvas =
    document.getElementById("globe");


  /* =====================================================
     ORIGINAL EARTH SETTINGS
     ===================================================== */

  const SETTINGS = {

    baseSpin:0.010,

    cloudSpin:0.016,

    bobSpeed:0.020,

    earthDesat:0.88,

    earthContrast:1.10,

    earthBrightness:0.98

  };


  const isMobile =
    window.matchMedia &&
    window.matchMedia(
      "(max-width: 900px)"
    ).matches;


  const prefersReducedMotion =
    window.matchMedia &&
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;


  if(prefersReducedMotion){

    SETTINGS.baseSpin=0;

    SETTINGS.cloudSpin=0;

    SETTINGS.bobSpeed=0;

  }


  /* =====================================================
     THREE.JS
     ===================================================== */

  const renderer =
    new THREE.WebGLRenderer({

      canvas:canvas,

      antialias:!isMobile,

      alpha:true

    });


  renderer.setPixelRatio(

    Math.min(

      window.devicePixelRatio || 1,

      isMobile
        ? 1.5
        : 2

    )

  );


  renderer.outputColorSpace =
    THREE.SRGBColorSpace;


  const scene =
    new THREE.Scene();


  const camera =
    new THREE.PerspectiveCamera(

      35,

      1,

      0.1,

      200

    );


  camera.position.set(

    0.35,

    0.08,

    6.2

  );


  /* =====================================================
     LIGHTING
     ===================================================== */

  scene.add(

    new THREE.AmbientLight(

      0xffffff,

      0.30

    )

  );


  const key =
    new THREE.DirectionalLight(

      0xffffff,

      1.10

    );


  key.position.set(

    5,

    2.5,

    6

  );


  scene.add(key);


  const rim =
    new THREE.DirectionalLight(

      0x9fd7ff,

      0.85

    );


  rim.position.set(

    -8,

    -2,

    3

  );


  scene.add(rim);


  /* =====================================================
     RESIZE
     ===================================================== */

  function resize(){

    const w =
      canvas.clientWidth;

    const h =
      canvas.clientHeight;


    if(!w || !h){

      return;

    }


    renderer.setSize(

      w,

      h,

      false

    );


    camera.aspect =
      w / h;


    camera.updateProjectionMatrix();

  }


  window.addEventListener(

    "resize",

    resize

  );


  /* =====================================================
     EARTH TEXTURES
     ===================================================== */

  const TEX = {

    day:
      "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",

    normal:
      "https://threejs.org/examples/textures/planets/earth_normal_2048.jpg",

    spec:
      "https://threejs.org/examples/textures/planets/earth_specular_2048.jpg",

    clouds:
      "https://threejs.org/examples/textures/planets/earth_clouds_1024.png"

  };


  const loader =
    new THREE.TextureLoader();


  loader.crossOrigin =
    "anonymous";


  const loadTex =
    (url)=>
      new Promise(

        (resolve,reject)=>{

          loader.load(

            url,

            t=>{

              t.colorSpace =
                THREE.SRGBColorSpace;

              resolve(t);

            },

            undefined,

            reject

          );

        }

      );


  const seg =
    isMobile
      ? 96
      : 128;


  const earthGeo =
    new THREE.SphereGeometry(

      1.95,

      seg,

      seg

    );


  const cloudsGeo =
    new THREE.SphereGeometry(

      1.975,

      seg,

      seg

    );


  let earth;

  let clouds;

  let atmo;


  /* =====================================================
     BUILD EARTH
     ===================================================== */

  Promise.all([

    loadTex(
      TEX.day
    ),

    loadTex(
      TEX.normal
    ),

    loadTex(
      TEX.spec
    ),

    loadTex(
      TEX.clouds
    )

  ])

  .then(

    ([day,normal,spec,cloudsTex])=>{


      /* EARTH MATERIAL */

      const earthMat =
        new THREE.MeshPhongMaterial({

          map:day,

          normalMap:normal,

          specularMap:spec,

          specular:
            new THREE.Color(
              0x2b5a7a
            ),

          shininess:14

        });


      /*
        Preserve the original
        desaturated editorial Earth.
      */

      earthMat.onBeforeCompile =
        (shader)=>{


          shader.uniforms.uDesat =
            {
              value:
                SETTINGS.earthDesat
            };


          shader.uniforms.uContrast =
            {
              value:
                SETTINGS.earthContrast
            };


          shader.uniforms.uBright =
            {
              value:
                SETTINGS.earthBrightness
            };


          shader.fragmentShader =
            shader.fragmentShader.replace(

              "#include <dithering_fragment>",

              `

              float luma =
                dot(
                  gl_FragColor.rgb,
                  vec3(
                    0.299,
                    0.587,
                    0.114
                  )
                );

              vec3 gray =
                vec3(luma);

              gl_FragColor.rgb =
                mix(
                  gl_FragColor.rgb,
                  gray,
                  uDesat
                );

              gl_FragColor.rgb =
                (
                  gl_FragColor.rgb -
                  0.5
                )
                *
                uContrast
                +
                0.5;

              gl_FragColor.rgb *=
                uBright;

              #include <dithering_fragment>

              `

            );


          shader.fragmentShader =

            "uniform float uDesat; uniform float uContrast; uniform float uBright;\n"

            +

            shader.fragmentShader;

        };


      /* EARTH */

      earth =
        new THREE.Mesh(

          earthGeo,

          earthMat

        );


      earth.rotation.y =
        0.9;


      scene.add(
        earth
      );


      /* CLOUDS */

      clouds =
        new THREE.Mesh(

          cloudsGeo,

          new THREE.MeshLambertMaterial({

            map:
              cloudsTex,

            transparent:
              true,

            opacity:
              0.32,

            depthWrite:
              false

          })

        );


      clouds.rotation.y =
        earth.rotation.y +
        0.35;


      scene.add(
        clouds
      );


      /* ATMOSPHERE */

      atmo =
        new THREE.Mesh(

          new THREE.SphereGeometry(

            2.05,

            seg,

            seg

          ),

          new THREE.MeshBasicMaterial({

            color:
              0x9fd7ff,

            transparent:
              true,

            opacity:
              0.08,

            depthWrite:
              false,

            blending:
              THREE.AdditiveBlending

          })

        );


      scene.add(
        atmo
      );


      animate();

    }

  )

  .catch(

    err=>
      console.error(

        "Texture load error:",

        err

      )

  );


  /* =====================================================
     SIMPLE ORIGINAL ANIMATION
     ===================================================== */

  let tick=0;


  function animate(){

    requestAnimationFrame(
      animate
    );


    resize();


    tick +=
      SETTINGS.bobSpeed;


    if(earth){

      /*
        Quiet continuous Earth rotation.
        Nothing responds to scrolling.
      */

      earth.rotation.y +=
        SETTINGS.baseSpin;


      earth.rotation.x =
        Math.sin(tick) *
        0.02;


      if(clouds){

        clouds.rotation.y +=
          SETTINGS.cloudSpin;

      }

    }


    renderer.render(

      scene,

      camera

    );

  }


})();

</script>


</body>
</html>
